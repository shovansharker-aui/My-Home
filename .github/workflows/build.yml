name: Build APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Assemble debug and release APKs
        run: ./gradlew assembleDebug assembleRelease --stacktrace

      - name: Upload debug APK (workflow artifact)
        uses: actions/upload-artifact@v4
        with:
          name: mijia4k-debug
          path: app/build/outputs/apk/debug/*.apk

      # Every push to main republishes this rolling release so the latest
      # APK is always one click away in the repo's Releases section,
      # without needing to remember to tag a version first. Uses the gh CLI
      # directly (delete-then-recreate) rather than softprops/action-gh-release
      # for this step — that action has a bug where re-updating an existing
      # "latest" release across runs silently fails to actually attach the
      # new asset (confirmed: the release stayed on a stale commit/APK).
      - name: Publish rolling "latest" release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag --repo "$GITHUB_REPOSITORY" || true
          gh release create latest app/build/outputs/apk/release/*.apk \
            --repo "$GITHUB_REPOSITORY" \
            --title "Latest build (main)" \
            --notes "Automatically built from the latest commit on main (${{ github.sha }}). Not a tagged version — see other releases for stable, tagged versions." \
            --prerelease

      # A pushed version tag (vX.Y.Z) still cuts a proper, permanent release.
      - name: Create tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/*.apk
          generate_release_notes: true
